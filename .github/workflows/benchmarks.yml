name: Benchmarks

on:
  schedule:
    - cron: '0 3 * * *'
  workflow_dispatch:

concurrency:
  group: benchmarks
  cancel-in-progress: false

permissions:
  contents: read
  actions: read

jobs:

  benchmarks:

    runs-on: windows-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    # Skip the scheduled run when HEAD is unchanged since the last successful benchmark run
    - name: Detect changes since last benchmark run
      id: changes
      if: github.event_name == 'schedule'
      uses: actions/github-script@v7
      with:
        script: |
          const runs = await github.rest.actions.listWorkflowRuns({
            owner: context.repo.owner,
            repo: context.repo.repo,
            workflow_id: 'benchmarks.yml',
            status: 'success',
            per_page: 1,
          });
          const last = runs.data.workflow_runs[0];
          const changed = !last || last.head_sha !== context.sha;
          core.info(`last=${last?.head_sha ?? 'none'} current=${context.sha} changed=${changed}`);
          core.setOutput('changed', changed);

    - name: Install .NET Core
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x

    - name: Run benchmarks
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
      run: dotnet run --project LogGrokX.Benchmarks -c Release -- --filter "*" --exporters json html

    - name: Upload results
      if: github.event_name == 'workflow_dispatch' || steps.changes.outputs.changed == 'true'
      uses: actions/upload-artifact@v4
      with:
        name: benchmark-results-${{ github.sha }}
        path: BenchmarkDotNet.Artifacts/
        if-no-files-found: error

    - name: No changes
      if: github.event_name == 'schedule' && steps.changes.outputs.changed != 'true'
      run: echo "No changes since the last successful benchmark run; skipping."
